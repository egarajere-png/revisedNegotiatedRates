# Application configuration for the Negotiated Rates service.
#
# The spring.profiles.active property selects the active profile that
# determines environment-specific settings such as datasource and security.

spring.profiles.active=dev
server.port=8090

# SMTP mail settings used by the email notification service.
# These values are used by the Emailer utility to send notification messages.
spring.mail.host=172.16.2.60
spring.mail.port=25
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Application-specific email settings.
app.config.param.smtphost=172.16.2.60
app.config.param.email-from=helpdesk@abcthebank.com

# Log file configuration for the Spring Boot application.
logging.file.name=/logs/negotiated-rates/applogs-negotiated.log
logging.logback.rollingpolicy.max-history=100