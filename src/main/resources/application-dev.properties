# Development profile configuration for Negotiated Rates.
#
# This profile contains local development database, security and RabbitMQ
# settings used when spring.profiles.active=dev.

spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto = update
spring.jpa.generate-ddl=true
spring.datasource.username=abconnect
spring.datasource.password=abconnect
spring.datasource.url=jdbc:postgresql://localhost:5433/abconnect?createDatabaseIfNotExist=true

# Keycloak OAuth2 settings used to request tokens and validate JWTs.
params.keycloak.config.token-url=http://localhost:8080/realms/negotiated-rates/protocol/openid-connect/token
params.keycloak.config.clientid=negotiated-rates-api
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/negotiated-rates
params.keycloak.config.client-secret=brC62xyFR0xNUvRasNjvjhYDwDSbYrWu

# RabbitMQ settings used by the event-driven messaging components.
# These values are used by the RabbitTemplate and listener configuration.
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest