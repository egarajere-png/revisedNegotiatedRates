version: "3.8"

services:

  postgres:
    image: postgres:14
    container_name: negotiated-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: abconnect
      POSTGRES_PASSWORD: abconnect
      POSTGRES_DB: abconnect

    ports:
      - "5433:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      - negotiated-network


  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped

    ports:
      - "5672:5672"
      - "15672:15672"

    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

    networks:
      - negotiated-network


  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak
    restart: unless-stopped

    command:
      - start-dev
      - --import-realm

    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123

    ports:
      - "8080:8080"

    volumes:
      - ./keycloak/import:/opt/keycloak/data/import

    networks:
      - negotiated-network


volumes:

  postgres-data:
  rabbitmq-data:


networks:

  negotiated-network:
    driver: bridge